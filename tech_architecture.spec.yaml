meta:
  profile: default
  theme: arch-dark
  layout: horizontal
  canvas: 1440x900
  title: "InsightClue Enterprise Architecture"
  description: "Autonomous Multi-Agent FinTech Anomaly Detection & RCA Engine"

modules:
  - id: client_tier
    label: "Client Tier"
    style:
      fillColor: none
      strokeColor: "#334155"
      dashed: true
      dashPattern: "6 4"

  - id: api_tier
    label: "FastAPI Gateway & Route Adapters"
    style:
      fillColor: none
      strokeColor: "#334155"
      dashed: true
      dashPattern: "6 4"

  - id: service_tier
    label: "Core Domain Services Tier"
    style:
      fillColor: none
      strokeColor: "#334155"
      dashed: true
      dashPattern: "6 4"

  - id: agent_tier
    label: "LangGraph Multi-Agent Investigation Squad & AI Gateway"
    style:
      fillColor: none
      strokeColor: "#334155"
      dashed: true
      dashPattern: "6 4"

  - id: infra_tier
    label: "Persistence & Data Infrastructure Tier"
    style:
      fillColor: none
      strokeColor: "#334155"
      dashed: true
      dashPattern: "6 4"

nodes:
  # ================= Row 1: Client Tier (y: 80) =================
  - id: mission_control_ui
    label: "Mission Control UI\n(Vanilla JS • CSS3 • Charts)"
    type: user
    module: client_tier
    position: { x: 220, y: 80 }

  - id: sse_client
    label: "SSE EventSource\n(Real-Time Agent Stream)"
    type: user
    module: client_tier
    position: { x: 980, y: 80 }

  # ================= Row 2: API Tier (y: 200) =================
  - id: fastapi_gateway
    label: "FastAPI Web Gateway\n(Python 3.13 • ASGI)"
    type: gateway
    module: api_tier
    position: { x: 220, y: 200 }

  - id: metrics_route
    label: "Metrics Route\n(/api/metrics)"
    type: service
    module: api_tier
    position: { x: 460, y: 200 }

  - id: anomalies_route
    label: "Anomalies Route\n(/api/anomalies)"
    type: service
    module: api_tier
    position: { x: 720, y: 200 }

  - id: investigations_route
    label: "Investigations Route\n(/api/investigations)"
    type: service
    module: api_tier
    position: { x: 980, y: 200 }

  # ================= Row 3: Domain Services (y: 340) =================
  - id: dataset_adapter
    label: "DatasetAdapter\n(CFPB SQLite Ingestion)"
    type: process
    module: service_tier
    position: { x: 220, y: 340 }

  - id: telemetry_store
    label: "TelemetryMetricStore\n(SQL Aggregation Seam)"
    type: service
    module: service_tier
    position: { x: 460, y: 340 }

  - id: anomaly_detector
    label: "AnomalyDetector Engine\n(Z-Score & Isolation Forest)"
    type: process
    module: service_tier
    position: { x: 720, y: 340 }

  - id: investigation_service
    label: "InvestigationService\n(LangGraph Coordinator)"
    type: service
    module: service_tier
    position: { x: 980, y: 340 }

  - id: ticket_vector_store
    label: "TicketVectorStore\n(Cosine Distance <=> Search)"
    type: vector_store
    module: service_tier
    position: { x: 1260, y: 340 }

  # ================= Row 4: LangGraph Squad & LLM Gateway (y: 490-610) =================
  - id: supervisor_agent
    label: "Supervisor Agent\n(Triage & Hypothesis)"
    type: agent
    module: agent_tier
    position: { x: 980, y: 480 }

  - id: sql_analyst_agent
    label: "SQL Analyst Agent\n(Telemetry Query Specialist)"
    type: agent
    module: agent_tier
    position: { x: 460, y: 490 }

  - id: support_vector_agent
    label: "Support Vector Agent\n(CFPB Dispute Analyst)"
    type: agent
    module: agent_tier
    position: { x: 720, y: 540 }

  - id: sql_sandbox
    label: "SQL AST Sandbox\n(Safe Read-Only Guardrails)"
    type: tool
    module: agent_tier
    position: { x: 460, y: 610 }

  - id: synthesizer_agent
    label: "Synthesizer Agent\n(RCA Confidence & Verdict)"
    type: agent
    module: agent_tier
    position: { x: 980, y: 600 }

  - id: llm_client
    label: "Async LLM Gateway (LLMClient)\n(Cascade: 3.1-flash / lite)"
    type: llm
    module: agent_tier
    position: { x: 1260, y: 540 }

  # ================= Row 5: Infrastructure (y: 750) =================
  - id: redis_cache
    label: "Redis 7 Cache\n(Telemetry Cache)"
    type: memory
    module: infra_tier
    position: { x: 220, y: 750 }

  - id: postgres_db
    label: "PostgreSQL 16 Engine\n(Telemetry • Anomalies • Reports)"
    type: database
    module: infra_tier
    position: { x: 500, y: 750 }

  - id: pgvector_store
    label: "pgvector (HNSW Index)\n(768-dim Vectors)"
    type: vector_store
    module: infra_tier
    position: { x: 780, y: 750 }

  - id: fastembed_engine
    label: "FastEmbed ONNX Engine\n(bge-base-en-v1.5)"
    type: process
    module: infra_tier
    position: { x: 1080, y: 750 }

  # ================= Legend (y: 840) =================
  - id: legend
    label: "Legend:  gray = primary flow   orange = agent control   green = memory/data   violet = RCA feedback"
    type: text
    position: { x: 720, y: 840 }

edges:
  # Client & API Flow
  - from: mission_control_ui
    to: fastapi_gateway
    type: primary

  - from: fastapi_gateway
    to: metrics_route
    type: primary

  - from: fastapi_gateway
    to: anomalies_route
    type: primary

  - from: fastapi_gateway
    to: investigations_route
    type: primary

  - from: investigations_route
    to: sse_client
    type: data

  - from: sse_client
    to: mission_control_ui
    type: primary

  # Routes to Services
  - from: metrics_route
    to: telemetry_store
    type: primary

  - from: anomalies_route
    to: anomaly_detector
    type: primary

  - from: investigations_route
    to: investigation_service
    type: primary

  # Services to Infra & Storage
  - from: dataset_adapter
    to: postgres_db
    type: memory_write

  - from: telemetry_store
    to: postgres_db
    type: memory_read

  - from: telemetry_store
    to: redis_cache
    type: memory_read

  - from: anomaly_detector
    to: telemetry_store
    type: data

  - from: anomaly_detector
    to: postgres_db
    type: memory_write

  # Investigation & Agent Flow
  - from: investigation_service
    to: supervisor_agent
    type: control

  - from: investigation_service
    to: postgres_db
    type: memory_write

  - from: supervisor_agent
    to: sql_analyst_agent
    type: control

  - from: supervisor_agent
    to: support_vector_agent
    type: control

  - from: sql_analyst_agent
    to: sql_sandbox
    type: primary

  - from: sql_sandbox
    to: postgres_db
    type: memory_read

  - from: support_vector_agent
    to: ticket_vector_store
    type: memory_read

  - from: ticket_vector_store
    to: fastembed_engine
    type: data

  - from: ticket_vector_store
    to: pgvector_store
    type: memory_read

  - from: sql_analyst_agent
    to: synthesizer_agent
    type: data

  - from: support_vector_agent
    to: synthesizer_agent
    type: data

  - from: synthesizer_agent
    to: supervisor_agent
    type: feedback

  - from: supervisor_agent
    to: llm_client
    type: data

  - from: synthesizer_agent
    to: llm_client
    type: data
