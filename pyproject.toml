[project]
name = "insightclue"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.115.12",
    "fastembed>=0.8.0",
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "langchain-core>=0.3.65",
    "langgraph>=0.4.8",
    "numpy>=2.3.0",
    "pandas>=3.0.5",
    "pgvector>=0.5.0",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.0.1",
    "redis>=8.1.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "statsmodels>=0.14.6",
    "uvicorn[standard]>=0.34.3",
]

[tool.uv]
package = false

[tool.pyright]
include = ["src"]
extraPaths = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"




