meta:
  profile: default
  theme: arch-dark
  layout: horizontal
  canvas: 1440x920
  title: InsightClue Enterprise Architecture
  description: Autonomous Multi-Agent FinTech Anomaly Detection & RCA Engine
nodes:
  - id: mission_control_ui
    label: |-
      Mission Control Dashboard
      (Vanilla JS • CSS3 • Chart.js)
    type: user
    module: client_tier
    position:
      x: 440
      'y': 70
  - id: sse_client
    label: |-
      SSE EventSource Client
      (Real-Time Agent Stream)
    type: user
    module: client_tier
    position:
      x: 880
      'y': 70
  - id: fastapi_gateway
    label: |-
      FastAPI Gateway
      (Python 3.13 • ASGI)
    type: gateway
    module: api_tier
    position:
      x: 180
      'y': 190
  - id: metrics_route
    label: |-
      Metrics Route
      (/api/metrics)
    type: service
    module: api_tier
    position:
      x: 440
      'y': 190
  - id: anomalies_route
    label: |-
      Anomalies Route
      (/api/anomalies)
    type: service
    module: api_tier
    position:
      x: 700
      'y': 190
  - id: investigations_route
    label: |-
      Investigations Route
      (/api/investigations)
    type: service
    module: api_tier
    position:
      x: 1000
      'y': 190
  - id: dataset_adapter
    label: |-
      DatasetAdapter
      (CFPB SQLite Ingestion)
    type: process
    module: service_tier
    position:
      x: 150
      'y': 340
  - id: telemetry_store
    label: |-
      TelemetryMetricStore
      (SQL Aggregation Seam)
    type: service
    module: service_tier
    position:
      x: 420
      'y': 340
  - id: anomaly_detector
    label: |-
      AnomalyDetector
      (Z-Score & Isolation Forest)
    type: process
    module: service_tier
    position:
      x: 700
      'y': 340
  - id: investigation_service
    label: |-
      InvestigationService
      (LangGraph Coordinator)
    type: service
    module: service_tier
    position:
      x: 990
      'y': 340
  - id: ticket_vector_store
    label: |-
      TicketVectorStore
      (Cosine Distance <=> Search)
    type: vector_store
    module: service_tier
    position:
      x: 1270
      'y': 340
  - id: supervisor_agent
    label: |-
      Supervisor Agent
      (Triage & Hypothesis)
    type: agent
    module: agent_tier
    position:
      x: 250
      'y': 520
  - id: sql_analyst_agent
    label: |-
      SQL Analyst Agent
      (Telemetry Query Specialist)
    type: agent
    module: agent_tier
    position:
      x: 550
      'y': 460
  - id: support_vector_agent
    label: |-
      Support Vector Agent
      (CFPB Dispute Analyst)
    type: agent
    module: agent_tier
    position:
      x: 550
      'y': 580
  - id: sql_sandbox
    label: |-
      SQL AST Sandbox
      (Safe Read-Only Guardrails)
    type: tool
    module: agent_tier
    position:
      x: 840
      'y': 460
  - id: synthesizer_agent
    label: |-
      Synthesizer Agent
      (RCA Confidence & Verdict)
    type: agent
    module: agent_tier
    position:
      x: 1140
      'y': 520
  - id: redis_cache
    label: |-
      Redis 7 Cache
      (Telemetry Cache)
    type: memory
    module: infra_tier
    position:
      x: 150
      'y': 720
  - id: postgres_db
    label: |-
      PostgreSQL 16 Engine
      (Telemetry • Anomalies • Reports)
    type: database
    module: infra_tier
    position:
      x: 440
      'y': 720
  - id: pgvector_store
    label: |-
      pgvector (HNSW Index)
      (768-dim Vectors)
    type: vector_store
    module: infra_tier
    position:
      x: 740
      'y': 720
  - id: fastembed_engine
    label: |-
      FastEmbed ONNX Engine
      (bge-base-en-v1.5)
    type: process
    module: infra_tier
    position:
      x: 1000
      'y': 720
  - id: llm_client
    label: |-
      Async LLM Gateway (LLMClient)
      (Failover Cascade: 3.1-flash / lite)
    type: llm
    module: infra_tier
    position:
      x: 1270
      'y': 720
  - id: legend
    label: 'Legend:  gray = primary flow   orange = agent control   green = memory/data   violet = RCA feedback'
    type: text
    position:
      x: 700
      'y': 840
edges:
  - from: mission_control_ui
    to: fastapi_gateway
    type: primary
    label: HTTP Requests
  - from: fastapi_gateway
    to: metrics_route
    type: primary
  - from: fastapi_gateway
    to: anomalies_route
    type: primary
  - from: fastapi_gateway
    to: investigations_route
    type: primary
  - from: investigations_route
    to: sse_client
    type: data
    label: SSE Stream
  - from: sse_client
    to: mission_control_ui
    type: primary
    label: Live Telemetry
  - from: metrics_route
    to: telemetry_store
    type: primary
  - from: anomalies_route
    to: anomaly_detector
    type: primary
  - from: investigations_route
    to: investigation_service
    type: primary
  - from: dataset_adapter
    to: postgres_db
    type: memory_write
  - from: telemetry_store
    to: postgres_db
    type: memory_read
  - from: telemetry_store
    to: redis_cache
    type: memory_read
  - from: anomaly_detector
    to: telemetry_store
    type: data
  - from: anomaly_detector
    to: postgres_db
    type: memory_write
  - from: investigation_service
    to: supervisor_agent
    type: control
    label: Start Investigation
  - from: investigation_service
    to: postgres_db
    type: memory_write
  - from: supervisor_agent
    to: sql_analyst_agent
    type: control
    label: Dispatch SQL
  - from: supervisor_agent
    to: support_vector_agent
    type: control
    label: Dispatch Vector
  - from: sql_analyst_agent
    to: sql_sandbox
    type: primary
  - from: sql_sandbox
    to: postgres_db
    type: memory_read
  - from: support_vector_agent
    to: ticket_vector_store
    type: memory_read
  - from: ticket_vector_store
    to: fastembed_engine
    type: data
  - from: ticket_vector_store
    to: pgvector_store
    type: memory_read
  - from: sql_analyst_agent
    to: synthesizer_agent
    type: data
    label: SQL Facts
  - from: support_vector_agent
    to: synthesizer_agent
    type: data
    label: Customer Disputes
  - from: synthesizer_agent
    to: supervisor_agent
    type: feedback
    label: RCA Verdict
  - from: supervisor_agent
    to: llm_client
    type: data
  - from: synthesizer_agent
    to: llm_client
    type: data
modules:
  - id: client_tier
    label: Client & Presentation Tier
    style:
      fillColor: none
      strokeColor: '#334155'
      dashed: true
      dashPattern: 6 4
  - id: api_tier
    label: FastAPI Gateway & Route Adapters
    style:
      fillColor: none
      strokeColor: '#334155'
      dashed: true
      dashPattern: 6 4
  - id: service_tier
    label: Core Domain Services & Ingestion Seam
    style:
      fillColor: none
      strokeColor: '#334155'
      dashed: true
      dashPattern: 6 4
  - id: agent_tier
    label: LangGraph Multi-Agent Investigation Squad
    style:
      fillColor: none
      strokeColor: '#334155'
      dashed: true
      dashPattern: 6 4
  - id: infra_tier
    label: Persistence & AI Infrastructure Tier
    style:
      fillColor: none
      strokeColor: '#334155'
      dashed: true
      dashPattern: 6 4
